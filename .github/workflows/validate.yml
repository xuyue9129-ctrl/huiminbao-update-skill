name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python skills/huiminbao-update/scripts/test_workflow.py
      - run: python skills/huiminbao-update/scripts/workflow.py preflight
      - run: python skills/huiminbao-update/scripts/workflow.py scan-package --root .
      - run: python -m compileall -q skills
